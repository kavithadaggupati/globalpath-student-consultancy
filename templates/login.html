
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | GlobalPath</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a class="brand" href="{{ url_for('home') }}">GlobalPath</a>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>
    </header>

    <main class="form-container">
        <div class="form-card">
            <h1>Student Login</h1>
            <p>Sign in to access your student dashboard.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token"
                       value="{{ csrf_token() }}">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" maxlength="254"
                       placeholder="Enter your registered email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password"
                       placeholder="Enter your password" required>

                <button class="button full-width" type="submit">
                    Log In
                </button>
            </form>

            <p class="form-footer">
                New student?
                <a href="{{ url_for('register') }}">Create an account</a>
            </p>
        </div>
    </main>
</body>
</html>
